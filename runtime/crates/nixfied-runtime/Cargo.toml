[package]
name = "nixfied-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hex = "0.4"
libc = "0.2"
nixfied-model = { path = "../nixfied-model" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
nixfied-model = { path = "../nixfied-model", features = ["test-fixtures"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "nixfied-runtime"
path = "src/main.rs"

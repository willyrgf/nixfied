[package]
name = "nixfied-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hex = "0.4"
nixfied-model = { path = "../nixfied-model" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nixfied-runtime"
path = "src/main.rs"

name: Nix CI
permissions:
  contents: read

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: nix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    max-jobs = 2
    cores = 2

jobs:
  build-and-test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14

    runs-on: ${{ matrix.os }}
    env:
      CI_ARTIFACTS_DIR: /tmp/nixfied-artifacts-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
      REGISTRY_ROOT: /tmp/nixfied-registry-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
      CI_DEBUG_DIR: /tmp/nixfied-debug-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare runtime directories
        run: |
          set -euo pipefail
          rm -rf "$CI_ARTIFACTS_DIR" "$REGISTRY_ROOT" "$CI_DEBUG_DIR"
          mkdir -p "$CI_ARTIFACTS_DIR" "$REGISTRY_ROOT" "$CI_DEBUG_DIR"
          chmod 700 "$CI_ARTIFACTS_DIR" "$REGISTRY_ROOT" "$CI_DEBUG_DIR"

      - name: Capture runner baseline
        run: |
          set -euo pipefail
          log_file="$CI_DEBUG_DIR/runner-baseline.log"
          {
            echo "INFO: generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "INFO: runner_os=${{ runner.os }}"
            echo "INFO: matrix_os=${{ matrix.os }}"
            echo "INFO: pwd=$(pwd -P)"
            echo "INFO: uname=$(uname -a)"
            echo "INFO: nix_version=$(nix --version)"
            echo "INFO: nix_config_show"
            nix config show | grep -E '^(cores|max-jobs|sandbox|substituters|system) = ' || true
            echo "INFO: disk_usage"
            df -h .
            df -h /tmp
            if command -v sw_vers >/dev/null 2>&1; then
              echo "INFO: sw_vers"
              sw_vers
            fi
            if [ -x /usr/bin/xcrun ]; then
              echo "INFO: xcrun_sdkroot"
              /usr/bin/xcrun --sdk macosx --show-sdk-path || true
            fi
          } 2>&1 | tee "$log_file"

      - name: Run .#help
        id: run_help
        continue-on-error: true
        run: |
          set -euo pipefail
          log_file="$CI_DEBUG_DIR/run-help.log"
          {
            output="$(nix run .#help -L -v --log-format bar-with-logs)"
            expected_header="$(head -n1 tests/framework/snapshots/help.txt)"
            echo "$output"
            echo "$output" | grep -Fq "$expected_header"
          } 2>&1 | tee "$log_file"

      - name: Run framework shard compile
        id: shard_compile
        continue-on-error: true
        run: |
          set -euo pipefail
          log_file="$CI_DEBUG_DIR/framework-shard-compile.log"
          nix run -L -v --log-format bar-with-logs .#framework::test -- --summary --serial --shard compile 2>&1 | tee "$log_file"

      - name: Show all features
        run: |
          log_file="$CI_DEBUG_DIR/show-features.log"
          set -euo pipefail
          nix run -L -v --log-format bar-with-logs .#features | tee "$log_file"


      - name: Run framework shard manifest
        id: shard_manifest
        continue-on-error: true
        run: |
          set -euo pipefail
          log_file="$CI_DEBUG_DIR/framework-shard-manifest.log"
          nix run -L -v --log-format bar-with-logs .#framework::test -- --summary --serial --shard manifest 2>&1 | tee "$log_file"

      - name: Run framework shard kernel
        id: shard_kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          log_file="$CI_DEBUG_DIR/framework-shard-kernel.log"
          nix run -L -v --log-format bar-with-logs .#framework::test -- --summary --serial --shard kernel 2>&1 | tee "$log_file"

      - name: Run framework shard adapters
        id: shard_adapters
        continue-on-error: true
        run: |
          set -euo pipefail
          log_file="$CI_DEBUG_DIR/framework-shard-adapters.log"
          nix run -L -v --log-format bar-with-logs .#framework::test -- --summary --serial --shard adapters 2>&1 | tee "$log_file"

      - name: Run framework shard migration
        id: shard_migration
        continue-on-error: true
        run: |
          set -euo pipefail
          log_file="$CI_DEBUG_DIR/framework-shard-migration.log"
          nix run -L -v --log-format bar-with-logs .#framework::test -- --summary --serial --shard migration 2>&1 | tee "$log_file"

      - name: Run framework shard services
        id: shard_services
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          log_file="$CI_DEBUG_DIR/framework-shard-services.log"
          nix run -L -v --log-format bar-with-logs .#framework::test -- --summary --serial --shard services 2>&1 | tee "$log_file"

      - name: Run framework shard e2e
        id: shard_e2e
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          log_file="$CI_DEBUG_DIR/framework-shard-e2e.log"
          nix run -L -v --log-format bar-with-logs .#framework::test -- --summary --serial --shard e2e 2>&1 | tee "$log_file"

      - name: Verify build-and-test outcomes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$CI_DEBUG_DIR"
          status_file="$CI_DEBUG_DIR/build-and-test-status.log"
          failed=0

          report_step() {
            local step_name="$1"
            local outcome="$2"
            if [ "$outcome" = "success" ]; then
              echo "OK: step passed name=$step_name"
            elif [ "$outcome" = "skipped" ]; then
              echo "SKIP: step skipped name=$step_name"
            else
              echo "ERROR: step failed name=$step_name outcome=$outcome"
              failed=1
            fi
          }

          {
            report_step "help-surface" "${{ steps.run_help.outcome }}"
            report_step "framework-shard-compile" "${{ steps.shard_compile.outcome }}"
            report_step "framework-shard-manifest" "${{ steps.shard_manifest.outcome }}"
            report_step "framework-shard-kernel" "${{ steps.shard_kernel.outcome }}"
            report_step "framework-shard-adapters" "${{ steps.shard_adapters.outcome }}"
            report_step "framework-shard-migration" "${{ steps.shard_migration.outcome }}"
            report_step "framework-shard-services" "${{ steps.shard_services.outcome }}"
            report_step "framework-shard-e2e" "${{ steps.shard_e2e.outcome }}"
          } 2>&1 | tee "$status_file"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Summarize build-and-test failure context
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p "$CI_DEBUG_DIR"
          summary_file="$CI_DEBUG_DIR/failure-summary.log"
          {
            echo "INFO: generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "INFO: ci_debug_dir=$CI_DEBUG_DIR"
            echo "INFO: ci_artifacts_dir=$CI_ARTIFACTS_DIR"
            if [ -d "$CI_ARTIFACTS_DIR" ]; then
              find "$CI_ARTIFACTS_DIR" -print | sort
              while IFS= read -r summary_json; do
                echo "INFO: summary_json=$summary_json"
                cat "$summary_json"
              done < <(find "$CI_ARTIFACTS_DIR" -type f -name summary.json | sort)
            else
              echo "WARN: missing directory $CI_ARTIFACTS_DIR"
            fi
            echo "INFO: registry_root=$REGISTRY_ROOT"
            if [ -d "$REGISTRY_ROOT" ]; then
              find "$REGISTRY_ROOT" -print | sort
            else
              echo "WARN: missing directory $REGISTRY_ROOT"
            fi
            if [ -f "$REGISTRY_ROOT/events.ndjson" ]; then
              echo "INFO: tail registry events"
              tail -n 200 "$REGISTRY_ROOT/events.ndjson"
            else
              echo "WARN: missing registry events file"
            fi
          } > "$summary_file" 2>&1
          cat "$summary_file"

      - name: Upload build-and-test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nix-ci-build-and-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
          path: |
            ${{ env.CI_DEBUG_DIR }}
            ${{ env.CI_ARTIFACTS_DIR }}
            ${{ env.REGISTRY_ROOT }}
          if-no-files-found: warn
          retention-days: 7

  isolation:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        slot:
          - 5
          - 7
          - 8
          - 9
        project_env:
          - dev
          - prod
          - test

    runs-on: ubuntu-24.04
    env:
      CI_ARTIFACTS_DIR: /tmp/nixfied-artifacts-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-24.04-slot${{ matrix.slot }}-${{ matrix.project_env }}
      REGISTRY_ROOT: /tmp/nixfied-registry-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-24.04-slot${{ matrix.slot }}-${{ matrix.project_env }}
      CI_DEBUG_DIR: /tmp/nixfied-debug-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-24.04-slot${{ matrix.slot }}-${{ matrix.project_env }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare runtime directories
        run: |
          set -euo pipefail
          rm -rf "$CI_ARTIFACTS_DIR" "$REGISTRY_ROOT" "$CI_DEBUG_DIR"
          mkdir -p "$CI_ARTIFACTS_DIR" "$REGISTRY_ROOT" "$CI_DEBUG_DIR"
          chmod 700 "$CI_ARTIFACTS_DIR" "$REGISTRY_ROOT" "$CI_DEBUG_DIR"

      - name: Capture runner baseline
        run: |
          set -euo pipefail
          log_file="$CI_DEBUG_DIR/runner-baseline.log"
          {
            echo "INFO: generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "INFO: runner_os=${{ runner.os }}"
            echo "INFO: slot=${{ matrix.slot }}"
            echo "INFO: project_env=${{ matrix.project_env }}"
            echo "INFO: pwd=$(pwd -P)"
            echo "INFO: uname=$(uname -a)"
            echo "INFO: nix_version=$(nix --version)"
            echo "INFO: nix_config_show"
            nix config show | grep -E '^(cores|max-jobs|sandbox|substituters|system) = ' || true
            echo "INFO: disk_usage"
            df -h .
            df -h /tmp
          } 2>&1 | tee "$log_file"

      - name: Run isolation cell
        run: |
          set -euo pipefail
          log_file="$CI_DEBUG_DIR/isolation-cell.log"
          nix run -L -v --log-format bar-with-logs .#test-isolation -- --slot ${{ matrix.slot }} --env ${{ matrix.project_env }} --max-parallel 1 2>&1 | tee "$log_file"

      - name: Summarize isolation failure context
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p "$CI_DEBUG_DIR"
          summary_file="$CI_DEBUG_DIR/failure-summary.log"
          {
            echo "INFO: generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "INFO: ci_debug_dir=$CI_DEBUG_DIR"
            echo "INFO: ci_artifacts_dir=$CI_ARTIFACTS_DIR"
            if [ -d "$CI_ARTIFACTS_DIR" ]; then
              find "$CI_ARTIFACTS_DIR" -print | sort
              while IFS= read -r summary_json; do
                echo "INFO: summary_json=$summary_json"
                cat "$summary_json"
              done < <(find "$CI_ARTIFACTS_DIR" -type f -name summary.json | sort)
            else
              echo "WARN: missing directory $CI_ARTIFACTS_DIR"
            fi
            echo "INFO: registry_root=$REGISTRY_ROOT"
            if [ -d "$REGISTRY_ROOT" ]; then
              find "$REGISTRY_ROOT" -print | sort
            else
              echo "WARN: missing directory $REGISTRY_ROOT"
            fi
            if [ -f "$REGISTRY_ROOT/events.ndjson" ]; then
              echo "INFO: tail registry events"
              tail -n 200 "$REGISTRY_ROOT/events.ndjson"
            else
              echo "WARN: missing registry events file"
            fi
            isolation_log_source="$CI_DEBUG_DIR/isolation-cell.log"
            isolation_logs_dir="$CI_DEBUG_DIR/isolation-logs"
            if [ -f "$isolation_log_source" ]; then
              isolation_logs_root="$(
                sed -n 's/^INFO: test-isolation logs_root=//p' "$isolation_log_source" | tail -n 1
              )"
              if [ -n "$isolation_logs_root" ]; then
                echo "INFO: isolation_logs_root=$isolation_logs_root"
                if [ -d "$isolation_logs_root" ]; then
                  rm -rf "$isolation_logs_dir"
                  mkdir -p "$isolation_logs_dir"
                  cp -R "$isolation_logs_root"/. "$isolation_logs_dir"/
                  echo "INFO: copied isolation logs dir=$isolation_logs_dir"
                  find "$isolation_logs_dir" -print | sort
                  while IFS= read -r log_file; do
                    echo "INFO: log_file=$log_file"
                    cat "$log_file"
                  done < <(
                    find "$isolation_logs_dir" -type f \( -name validate.log -o -name run.log \) | sort
                  )
                  while IFS= read -r summary_json; do
                    echo "INFO: summary_json=$summary_json"
                    cat "$summary_json"
                  done < <(find "$isolation_logs_dir" -type f -name summary.json | sort)
                  while IFS= read -r events_file; do
                    echo "INFO: tail registry events file=$events_file"
                    tail -n 200 "$events_file"
                  done < <(find "$isolation_logs_dir" -type f -path '*/registry/events.ndjson' | sort)
                else
                  echo "WARN: missing isolation logs root $isolation_logs_root"
                fi
              else
                echo "WARN: unable to resolve isolation logs root from $isolation_log_source"
              fi
            else
              echo "WARN: missing isolation cell log $isolation_log_source"
            fi
          } > "$summary_file" 2>&1
          cat "$summary_file"

      - name: Upload isolation failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nix-ci-isolation-${{ github.run_id }}-${{ github.run_attempt }}-slot${{ matrix.slot }}-${{ matrix.project_env }}
          path: |
            ${{ env.CI_DEBUG_DIR }}
            ${{ env.CI_ARTIFACTS_DIR }}
            ${{ env.REGISTRY_ROOT }}
          if-no-files-found: warn
          retention-days: 7

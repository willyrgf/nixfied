name: Nix CI
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [dev]
  pull_request:

env:
  BUILD_CMD: "nix flake check -L -v --log-format bar-with-logs"
  RUN_CMD: "nix run .#help -L -v --log-format bar-with-logs"
  RUN_TESTS_CMD: "nix run -L -v --log-format bar-with-logs .#framework::test -- --summary"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global init.defaultBranch main

      - name: Nix flake check
        run: |
          nix flake check

      - name: Run .#help
        run: |
          echo $RUN_CMD
          output=$(eval $RUN_CMD)
          echo "$output"
          echo "$output" | grep -q 'Nixfied commands (model-generated)'

      - name: Run .#framework::test
        run: |
          echo $RUN_TESTS_CMD
          eval $RUN_TESTS_CMD

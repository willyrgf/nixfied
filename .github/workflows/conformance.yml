name: conformance

# The self-hosted conformance gate, layered so a bug in the runtime cannot
# certify itself: the trusted cargo floor runs first, then nix flake check's
# structural gates, then the product orchestrates its own end-to-end conformance.
on:
  push:
    branches: [dev, v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # 1. Trusted floor: the runtime's own primitives, graded without the
      #    runtime grading itself. Pinned toolchain via the dev shell.
      - name: cargo floor (fmt, clippy, test)
        run: |
          nix develop --command bash -euo pipefail -c '
            cd runtime
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace
          '

      # 2. Structural gates: every model builds and the binaries compile.
      - name: nix flake check
        run: nix flake check

      # 3. Dogfood gate: the product orchestrates its own conformance, run by the
      #    nix-built runtime under test through the same surfaces adopters use.
      - name: build runtime + self-model
        run: |
          echo "RUNTIME_BIN=$(nix build .#nixfied-runtime --no-link --print-out-paths)/bin/nixfied-runtime" >> "$GITHUB_ENV"
          echo "SELF_MODEL=$(nix build .#self-model --no-link --print-out-paths)/model.json" >> "$GITHUB_ENV"
      - name: check smoke (fast launch sanity)
        run: "$RUNTIME_BIN" check --model "$SELF_MODEL"
      - name: run --workflow conformance
        env:
          NIXFIED_CONFORMANCE_CHECKOUT: ${{ github.workspace }}
          NIXFIED_CONFORMANCE_ARTIFACTS: ${{ github.workspace }}/conformance-artifacts
        run: |
          nix develop --command bash -euo pipefail -c '
            "$RUNTIME_BIN" run --model "$SELF_MODEL" --workflow conformance --timeout-ms 600000
          '
      - name: ground-truth artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-artifacts
          path: conformance-artifacts/
          if-no-files-found: warn
